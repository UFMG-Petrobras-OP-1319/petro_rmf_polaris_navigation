# Params file to vector_field_control

controller:
  ros__parameters:
    speed_ref: 0.2
    convergence_gain: 8.0

    pose_topic_type: "TFMessage"
    pose_topic_name: "tf"
    tf_reference_frame: "map"
    tf_robot_pose: "base_link"

    path_topic_name: "ref_path"
    cmd_vel_topic_name: "vec_to_follow"
    closest_obstacle_topic_name: "closest_obstacle"
    is_path_closed_service_name: "is_path_closed"

    flag_follow_obstacle: true
    lambda: 0.6
    switch_dist: 0.6
    switch_dist_outer: 0.9
    goal_tolerance: 0.15
    goal_hysteresis: 0.22
    slowdown_radius: 0.6
    min_tracking_speed: 0.08

    add_measurement_noise: false
    noise_mean_position: 0.0
    noise_stddev_position: 0.0
    noise_mean_yaw: 0.0
    noise_stddev_yaw: 0.0


feedback_linearization:
  ros__parameters:
    distancia_ponto_controle: 0.15
    const_vel: 1.0
    const_omega: 2.0
    control_period: 0.05
    cmd_vel_topic: "cmd_vel"
    vec_to_follow_topic: "vec_to_follow"
    pose_topic_type: "PoseWithCovarianceStamped"
    pose_topic: "amcl_pose"
    tf_robot_pose: "body"
    tf_inertial_link: "map"

follower_control:
  ros__parameters:
    distancia_ponto_controle: 0.15
    const_vel: 0.2
    const_omega: 2.0
    control_period: 0.05
    cmd_vel_topic: "cmd_vel"
    vec_to_follow_topic: "vec_to_follow"
    pose_topic_type: "TFMessage"
    pose_topic: "tf"
    tf_robot_pose: "base_link"
    tf_inertial_link: "map"
    orient_point_topic: "inspection_pose"
    stop_robot_topic: "stop_robot"
    stop_control_topic: "stop_control"
    clear_planner_service: "clear_planner"
    kp_pos: 1.0
    kp_orient: 1.0


planner:
  ros__parameters:
    N_points: 8
    flag_interpolation_method: 1
    max_point_distance: 0.2
    path_topic_name: "ref_path"
    visualization_topic_name: "visual_path"
    clicked_point_topic_name: "goal_pose"
    pose_topic_type: "TFMessage"
    pose_topic_name: "tf"
    tf_reference_frame: "map"
    tf_robot_pose: "base_link"
    start_service_name: "start_planner"
    clear_service_name: "clear_planner"
    is_path_closed_service_name: "is_path_closed"
    remove_last_point_service_name: "remove_last_point"


# Photos the fleet asks for (picture_taker.py, started by follower_control.launch.py).
# The values describe the simulated robot; `hardware` overrides them on the real
# robot (use_sim_time false). Camera names are the ones the fleet's take_picture uses.
picture_taker:
  ros__parameters:
    request_topic: "take_picture_request"
    result_topic: "take_picture_result"
    cameras: ["default", "inspection"]
    # Fixed RGB-D camera: Gazebo rgbd_camera in simulation, the RealSense on the robot,
    # both served by an image_snapshot node
    default:
      type: "fixed"
      service: "fixed_camera_snapshot/take_photo"
    # Hikvision PTZ on the pan-tilt
    inspection:
      type: "pan_tilt"
      service: "ptz_camera_snapshot/take_photo"
      joint_state_topic: "joint_states"
      pan_joint: "pan_joint"
      tilt_joint: "tilt_joint"
      tolerance_rad: 0.05        # per joint; pan compared modulo 2*pi
      settle_sec: 1.0            # on target this long before the shutter (covers RTSP lag)
      feedback_max_age_sec: 1.0
    ready_timeout_sec: 15.0      # report a failure when not ready by then
    service_timeout_sec: 5.0
    still_window_sec: 1.0        # base within still_linear_m / still_angular_rad this long
    still_linear_m: 0.02
    still_angular_rad: 0.02
    photo_dir: "/tmp/polaris_pictures"
    max_width: 0                 # 0 = full resolution; otherwise scale wider photos down
    jpeg_quality: 90             # only used when a photo is re-encoded
    hardware:
      inspection:
        service: "hk_camera_rtsp_pub/take_photo"
        joint_state_topic: "hk_camera_ptz/joint_states"
